---
- name: Converge
  become: true
  hosts: all
  vars:
    loop_device_range: "{{ range(0, 2) | list }}"
  pre_tasks:
  - name: Create loop device files
    command: "dd if=/dev/zero of=/loop-test-{{ item }}.img bs=1M count=72"
    loop: "{{ loop_device_range }}"
    tags:
    - skip_ansible_lint
  - name: Setup loop device
    command: "losetup -f /loop-test-{{ item }}.img"
    loop: "{{ loop_device_range }}"
    tags:
    - skip_ansible_lint
  - name: Get test devices
    ansible.builtin.shell: |
      set -e -o pipefail
      losetup -O NAME,BACK-FILE | awk '/loop-test-/ {print $1}'
    args:
      executable: /usr/bin/bash
    register: _test_devices
    tags:
    - skip_ansible_lint
  - name: Set test_device facts
    ansible.builtin.set_fact:
      test_devices: "{{ _test_devices.stdout_lines }}"
  - name: Snapshot /etc/fstab before the role runs
    ansible.builtin.copy:
      src: /etc/fstab
      dest: /tmp/molecule-format-fstab.pre
      remote_src: true
      mode: "0644"
    tags:
    - skip_ansible_lint
  tasks:
  - name: "Run role"
    ansible.builtin.include_role:
      name: "cloudnull.filesystems.format"
    vars:
      format_filesystem: xfs
      format_device: "{{ test_devices[0] }}"
      format_mount_point: /mnt/xfs-mount-point
  - name: "Run role"
    ansible.builtin.include_role:
      name: "cloudnull.filesystems.format"
    vars:
      format_filesystem: ext4
      format_device: "{{ test_devices[1] }}"
      format_mount_point: /mnt/ext4-mount-point
  - name: "Run role again with the xfs device's mount point changed"
    ansible.builtin.include_role:
      name: "cloudnull.filesystems.format"
    vars:
      format_filesystem: xfs
      format_device: "{{ test_devices[0] }}"
      format_mount_points:
        mount_points:
        - /mnt/xfs-mount-point-a
        - /mnt/xfs-mount-point-b
