---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: end-of-file-fixer
    - id: trailing-whitespace
    - id: mixed-line-ending
    - id: fix-byte-order-marker
    - id: check-executables-have-shebangs
    - id: check-merge-conflict
    - id: check-symlinks
    - id: check-yaml
      files: .*\.(yaml|yml)$
      args:
      - "--allow-multiple-documents"
      - "--unsafe"
    - id: debug-statements
  - repo: https://github.com/psf/black
    rev: 22.3.0
    hooks:
    - id: black
  - repo: https://github.com/ansible-community/ansible-lint
    rev: v26.4.0
    hooks:
      - id: ansible-lint
        # Override the hook's pinned language_version (python3.14 in v26.4.0) so the
        # env builds with each CI job's matrix Python (3.12/3.13/3.14) instead of
        # requiring 3.14 to be present on every runner.
        language_version: default
        always_run: false
        exclude_types:
          - markdown
          - shell
        args:
          - --offline
        additional_dependencies:
          - ansible
          - yamllint
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shellcheck
