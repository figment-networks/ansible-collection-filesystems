name: Run pull-request syntax workflows
on:
- pull_request
jobs:
  pre_commit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
        - "3.12"
        - "3.13"
        - "3.14"
    steps:
    - name: Check out the repo
      # versioneer: updater=github repository=actions/checkout max-major=7 tags=github
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      # versioneer: updater=github repository=actions/setup-python max-major=7 tags=github
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Get changed files
      id: changed-files
      # Home-grown replacement for tj-actions/changed-files: that action tries to
      # `git fetch` the PR branch mid-run when the checkout's history is too
      # shallow, which needs the checkout's persisted credential -- disabling
      # persist-credentials above (zizmor: credential-persistence) broke it
      # outright. fetch-depth: 0 means every commit this step needs is already
      # local, so this only ever runs a local `git diff` -- no network, no
      # credential, no third-party action.
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
        PUSH_HEAD_SHA: ${{ github.sha }}
      run: |
        if [ "$EVENT_NAME" = "pull_request" ]; then
          diff_base="$PR_BASE_SHA"
          diff_head="$PR_HEAD_SHA"
        else
          diff_base="$PUSH_BEFORE_SHA"
          diff_head="$PUSH_HEAD_SHA"
        fi

        # PUSH_BEFORE_SHA is the all-zero SHA on a branch's first push (nothing to
        # diff against) -- fall back to the empty tree so every tracked file
        # counts as "changed" rather than erroring.
        if [ -z "$diff_base" ] || [ "$diff_base" = "0000000000000000000000000000000000000000" ]; then
          diff_base=$(git hash-object -t tree /dev/null)
        fi

        changed_files=$(git diff --name-only "$diff_base" "$diff_head" | tr '\n' ' ')
        echo "all_changed_files=${changed_files}" >> "$GITHUB_OUTPUT"
    - name: Run Check
      # pre-commit/action pins actions/cache@v4 (a floating tag) inside its own
      # action.yml. GitHub resolves nested action refs too, and our org's
      # Actions allow-list blocks that unpinned nested reference even though
      # our own uses: lines are all SHA-pinned. figment-github-actions ships a
      # drop-in replacement that does the same three steps (install, cache,
      # run) but with actions/cache itself pinned to a commit SHA.
      # versioneer: updater=github repository=figment-networks/figment-github-actions tag-prefix=pre-commit/ max-major=1 tags=github
      uses: figment-networks/figment-github-actions/.github/actions/pre-commit@62d4980595a5b39fdc8c54cf4e445f8bca6c88a5 # pre-commit/v1.0.4
      with:
        extra_args: --files ${{ steps.changed-files.outputs.all_changed_files }}
    - name: Checks failed, notification
      if: failure()
      run: |
        echo "Tests Failed"
        echo "Run the following command to identify issues"
        echo "pre-commit run --files ${{ steps.changed-files.outputs.all_changed_files }}"
    - name: Upload log artifacts on failure
      if: failure()
      # versioneer: updater=github repository=actions/upload-artifact max-major=7 tags=github
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pre-commit-py${{ matrix.python-version }}
        path: /home/runner/.cache/pre-commit/pre-commit.log
